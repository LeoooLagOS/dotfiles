# MPD — the Hi-Res music library behind the panel's Media → Library view.
# Runs as a user service (systemctl --user enable --now mpd). Linked to
# ~/.config/mpd/mpd.conf by install.sh; state lives outside the repo.

music_directory     "~/Music"
playlist_directory  "~/Music/Playlists"
db_file             "~/.local/share/mpd/database"
state_file          "~/.local/state/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"
log_file            "syslog"

# The panel talks to MPD over this socket (scripts/library.py); localhost:6600
# for other clients (mpc, phones…)
bind_to_address     "~/.local/state/mpd/socket"
bind_to_address     "127.0.0.1"
port                "6600"

auto_update         "yes"          # new albums in ~/Music show up by themselves
restore_paused      "yes"
follow_outside_symlinks "yes"

# Quality: no resampling or re-dithering by MPD; gapless albums; ReplayGain
# (album mode) evens out loudness between albums using the tags beets writes,
# applied as volume, not by altering the samples
gapless_mp3_playback "yes"
replaygain           "album"
replaygain_limit     "yes"
volume_normalization "no"

audio_output {
    type        "pipewire"
    name        "PipeWire"
    # MPD hands PipeWire the file's own format (e.g. 24-bit/96 kHz); PipeWire
    # switches the device to it (config/pipewire/pipewire.conf.d/10-hires.conf)
}

# Bigger buffer: smooth playback of 24/192 files while the system is busy
audio_buffer_size   "8192"
