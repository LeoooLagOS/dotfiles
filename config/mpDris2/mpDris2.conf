# mpDris2: MPD as an MPRIS player, so what the panel's Library plays from
# ~/Music shows wherever the panel follows MPRIS (the island, Overview's media
# card, the Media tab's player view) and media keys / playerctl reach it.
# Installed by install.sh; the service: systemctl --user enable --now mpDris2

[Connection]
host = 127.0.0.1
port = 6600
# Album art: cover.jpg (or folder/front…) in the album's folder, else the
# picture embedded in the file (python3-mutagen)
music_dir = ~/Music

[Library]
cover_regex = ^(album|cover|\.?folder|front).*\.(gif|jpeg|jpg|png|webp)$

[Bling]
# The panel shows its own popups and binds the media keys (playerctl)
notify = False
mmkeys = False
