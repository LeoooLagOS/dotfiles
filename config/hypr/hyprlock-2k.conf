# Minimalist Mac-Style Hyprlock Config

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/dotfiles/scripts/wm

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(0,0,0)

    # Blur effect for the frosted glass look
    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# ----------------- TOP AREA: TIME & DATE ----------------- #

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 110
    font_family = Inter, San Francisco, Ubuntu, sans-serif
    position = 0, -80
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 3
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "$(date +'%A, %-d %B')"
    color = rgba(255, 255, 255, 0.9)
    font_size = 22
    font_family = Inter, San Francisco, Ubuntu, sans-serif
    position = 0, -230
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 2
}

# ----------------- CENTER AREA: LOGIN ----------------- #

# Avatar Image (Mac Style)
image {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current # Cambia esto por la ruta de tu foto
    size = 120
    rounding = -1 # Makes it a perfect circle
    border_size = 2
    border_color = rgba(255, 255, 255, 0.4)
    rotate = 0
    reload_time = -1
    position = 0, 60
    halign = center
    valign = center
    shadow_passes = 1
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 45
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0.1)
    inner_color = rgba(255, 255, 255, 0.15)
    capslock_color = rgb(255, 255, 255)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    font_family = Inter, San Francisco, Ubuntu, sans-serif
    placeholder_text = <i><span foreground="##ffffffcc">Enter Password</span></i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

# Keyboard LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.5)
    font_size = 12
    font_family = Inter, San Francisco, Ubuntu, sans-serif
    position = 0, -90
    halign = center
    valign = center
}


