# Minimalist Mac-Style Hyprlock Config (High-Res / 2K+)

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/dotfiles/scripts/wm

general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(0,0,0)

    # Blur effect for the frosted glass look
    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# ----------------- TOP AREA: TIME & DATE ----------------- #

# Hour-Time (Scaled up for 2K)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 150
    font_family = Inter, San Francisco, Ubuntu, sans-serif
    position = 0, -110
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 3
}

# Date (Scaled up for 2K)
label {
    monitor =
    text = cmd[update:18000000] echo "$(date +'%A, %-d %B')"
    color = rgba(255, 255, 255, 0.9)
    font_size = 32
    font_family = Inter, San Francisco, Ubuntu, sans-serif
    position = 0, -320
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 2
}

