# OPTION 3: Text Only with Username (No image)
# To use this, comment out the image options above and uncomment this block.
 label {
     monitor =
     text =   $USER
     color = rgba(255, 255, 255, 0.9)
     font_size = 22
     font_family = Inter, San Francisco, Ubuntu, sans-serif
     position = 0, 10
     halign = center
     valign = center
     shadow_passes = 1
 }

# INPUT FIELD
input-field {
    monitor =
    size = 320, 60
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0.1)
    inner_color = rgba(255, 255, 255, 0.15)
    capslock_color = rgb(255, 255, 255)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    font_family = Inter, San Francisco, Ubuntu, sans-serif
    placeholder_text = <i><span foreground="##ffffffcc">Enter Password</span></i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

# Keyboard LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.5)
    font_size = 16
    font_family = Inter, San Francisco, Ubuntu, sans-serif
    position = 0, -120
    halign = center
    valign = center
}

