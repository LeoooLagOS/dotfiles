# /* ---- 💫 https://github.com/LinuxBeginnings 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/

font_family FantasqueSansM Nerd Font Mono
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto
allow_remote_control yes

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

# Don't reopen at the last window's size and state: when the last kitty was
# maximized, every new one asked to be maximized too, and in Hyprland's
# scrolling layout each column took the whole screen instead of its 80%.
# Hyprland sizes the windows anyway (tiled) or the window rules (floating)
remember_window_size no

selection_foreground none
selection_background none

# foreground/background/cursor are set by the active theme
include /home/lag-os/.config/kitty/kitty-themes/Symfonic.conf
