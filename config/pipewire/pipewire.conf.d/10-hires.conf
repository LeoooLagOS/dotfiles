# Hi-Res audio: let the output follow the music's sample rate instead of
# resampling everything to 48 kHz. When one stream plays (e.g. a 24-bit/96 kHz
# FLAC from MPD), PipeWire switches the device to 96 kHz if the device supports
# it, so nothing is resampled ("bit-perfect" in the panel's Library view).
# Mixed rates (a 48 kHz video while music plays) still work: they are resampled.
# Linked to ~/.config/pipewire/pipewire.conf.d/ by install.sh (links step).
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
}
