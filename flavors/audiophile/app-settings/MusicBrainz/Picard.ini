; Picard settings of the Audiophile flavor, merged into ~/.config/MusicBrainz/Picard.ini
; by install.sh (flavors step) only where the key is missing: your own changes win.
; Values are Picard's own QSettings encoding (copied from a working Picard 3.0).
;   rename_files / move_files      rename and move into ~/Music/<album artist>/<album>/
;   save_images_to_files/_tags     cover.jpg in the folder and the art inside the file
;   dont_replace_*                 never replace an embedded front cover (keeps a Japanese obi)
;   ca_providers                   Cover Art Archive *Release* before *Release Group*
;                                  (the exact edition's art, not the album's generic one)
;   list_of_scripts                a tagger script deleting duplicated album_artist tags
;   track_ars                      performers, composers and works per track
[setting]
rename_files=true
move_files=true
save_images_to_files=true
save_images_to_tags=true
cover_image_filename=cover
embed_only_one_front_image=true
dont_replace_cover_of_types=true
dont_replace_included_types=@Variant(\0\0\0\t\0\0\0\x1\0\0\0\n\0\0\0\n\0\x66\0r\0o\0n\0t)
ca_providers=@Variant(\0\0\0\x7f\0\0\0\xePyQt_PyObject\0\0\0\0#\x80\x5\x95\x18\0\0\0\0\0\0\0\x8c\x11\x43over Art Archive\x94\x88\x86\x94.), @Variant(\0\0\0\x7f\0\0\0\xePyQt_PyObject\0\0\0\0!\x80\x5\x95\x16\0\0\0\0\0\0\0\x8c\xf\x43\x61\x61ReleaseGroup\x94\x88\x86\x94.), @Variant(\0\0\0\x7f\0\0\0\xePyQt_PyObject\0\0\0\0\"\x80\x5\x95\x17\0\0\0\0\0\0\0\x8c\x10UrlRelationships\x94\x88\x86\x94.), @Variant(\0\0\0\x7f\0\0\0\xePyQt_PyObject\0\0\0\0\x1d\x80\x5\x95\x12\0\0\0\0\0\0\0\x8c\vLocal Files\x94\x89\x86\x94.)
enable_tagger_scripts=true
list_of_scripts=@Variant(\0\0\0\t\0\0\0\x1\0\0\0\x7f\0\0\0\xePyQt_PyObject\0\0\0\0^\x80\x5\x95S\0\0\0\0\0\0\0(K\0\x8c\x1b\x63lean_duplicated_album_name\x94\x88\x8c+$delete(album_artist)\n$delete(album artist)\x94t\x94.)
track_ars=true
convert_punctuation=true
