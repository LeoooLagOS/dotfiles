# Screen stays black after waking from suspend, even though the system is
# awake (hyprlock takes the password, the power key works). On resume the
# Intel GPU fails to reconnect to the laptop panel:
#   i915 ... [CONNECTOR:...:eDP-1] ... Failed to enable link training
# Panel Self Refresh (PSR), a power-saving mode, is the usual cause on
# Alder Lake laptops, so turn it off. Costs a little battery.
#
# i915 loads from the initramfs, so rebuild it after installing:
#   sudo dracut --regenerate-all -f
# Check after a reboot (should print 0):
#   sudo cat /sys/module/i915/parameters/enable_psr
options i915 enable_psr=0
